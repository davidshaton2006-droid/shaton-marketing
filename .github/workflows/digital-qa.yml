name: Shaton Digital browser QA
on:
  push:
    branches: [main, digital-v2]
    paths: ['digital/**', '.github/workflows/digital-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check digital/assets/app.js
          node --check digital/assets/studio.js
          node --check digital/assets/daylight.js
          node --check digital/assets/design-components.js
          node --check digital/design/hero-preview.js
          node --check digital/qa/visual-capture.cjs
          node --check digital/qa/baseline-audit.cjs
          node --check digital/qa/lighthouse-audit.cjs
      - name: Install test tools
        working-directory: digital/qa
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run independent digital site QA
        working-directory: digital/qa
        run: npm test
      - name: Baseline screenshots and reference observations
        if: always() && github.ref == 'refs/heads/digital-v2'
        working-directory: digital/qa
        env:
          AUDIT_REFERENCES: '1'
        run: node baseline-audit.cjs
      - name: Lighthouse lab baseline
        if: always() && github.ref == 'refs/heads/digital-v2'
        working-directory: digital/qa
        run: node lighthouse-audit.cjs
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-browser-qa
          path: digital/qa/test-results/
          retention-days: 4

  preview:
    if: github.ref == 'refs/heads/digital-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        working-directory: digital/qa
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Test design previews
        working-directory: digital/qa
        run: npx playwright test -g 'Optical Foundry'
      - name: Visual inspection captures
        if: always()
        working-directory: digital/qa
        run: node visual-capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-design-preview
          path: digital/qa/test-results/
          retention-days: 4
