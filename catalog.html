<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шатон Learn — материалы по маркетингу</title>
<meta name="description" content="Приложение с практическими материалами по Авито, Яндекс Директу, сайтам, SEO, SMM и нейросетям: бесплатные руководства, сторис, разделы и личный кабинет. Работает и как Telegram-мини-приложение.">
<link rel="canonical" href="https://davidshaton2006-droid.github.io/shaton-marketing/catalog.html">
<meta name="theme-color" content="#f6f7fb">

<style>
@font-face{font-family:'Manrope';font-display:swap;font-weight:300 800;src:url(fonts/manrope-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-display:swap;font-weight:300 800;src:url(fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212}

/* Colour system (Ein UI rules): one anchor, 7 OKLCH stops with chroma tapering, everything else derived. */
:root{
  --color-1:oklch(0.95 0.081 266);--color-2:oklch(0.85 0.118 266);--color-3:oklch(0.73 0.162 266);--color-4:oklch(0.60 0.210 266);
  --color-5:oklch(0.48 0.166 266);--color-6:oklch(0.35 0.118 266);--color-7:oklch(0.20 0.063 266);
  --violet:oklch(from var(--color-3) l c calc(h + 34));--cyan:oklch(from var(--color-3) l c calc(h - 54));--deep:oklch(from var(--color-5) l c calc(h + 16));
  --rose:oklch(from var(--color-3) l c calc(h + 80));--mint:oklch(from var(--color-3) l c calc(h - 100));
  --ink:oklch(from var(--color-7) .17 calc(c*.5) h);
  --dim:oklch(from var(--color-5) .5 calc(c*.18) h);
  --mute:oklch(from var(--color-3) .68 calc(c*.18) h);
  --bg:oklch(from var(--color-1) .978 calc(c*.14) h);
  --panel:oklch(from var(--color-1) .958 calc(c*.16) h);
  --line:oklch(from var(--color-1) .9 calc(c*.3) h);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:hidden;
  background-image:radial-gradient(70% 36% at 100% 0%,oklch(from var(--color-2) l c h / .45),transparent 70%),radial-gradient(60% 30% at 0% 38%,oklch(from var(--violet) .93 c h / .4),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:60px;padding:max(8px,env(safe-area-inset-top,0px)) 0 8px;background:linear-gradient(var(--bg) 62%,transparent)}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-size:18px;flex:none}
.hi{flex:1;font-size:15px;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi b{color:var(--ink);font-weight:800}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--color-3),var(--color-5))}
.ava img{width:100%;height:100%;object-fit:cover}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 10px;margin:0 -16px;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:72px;text-align:center;scroll-snap-align:start}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(var(--color-4),var(--violet),var(--cyan),var(--color-4));display:grid;place-items:center}
.st.seen .ring{background:var(--line)}
.ring span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--bg);background:linear-gradient(145deg,var(--a),var(--b))}
.ring .i{width:26px;height:26px}
.st small{display:block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.search{display:flex;align-items:center;gap:10px;height:46px;margin:8px 0 18px;padding:0 16px;border-radius:16px;background:var(--panel);color:var(--mute)}
.search .i{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}

.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:21px;font-weight:800;letter-spacing:-.03em}
.sec button{font-size:13px;font-weight:700;color:var(--color-5)}
.lab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* big dark cards */
.car{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory}
.car::-webkit-scrollbar{display:none}
.hero{position:relative;flex:none;width:min(78vw,330px);height:250px;border-radius:26px;padding:18px;scroll-snap-align:start;color:#fff;overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  background:radial-gradient(90% 70% at 100% 0%,var(--g1),transparent 70%),radial-gradient(70% 60% at 0% 100%,var(--g2),transparent 70%),linear-gradient(160deg,var(--color-6),var(--color-7))}
.hero .lab{color:oklch(1 0 0 / .6)}
.hero h3{margin-top:4px;font-size:19px;line-height:1.15;letter-spacing:-.03em;font-weight:800;max-width:14ch}
.hero .big{position:absolute;right:-8px;top:34px;width:150px;height:150px;color:oklch(1 0 0 / .22)}
.hero .big .i{width:100%;height:100%;stroke-width:1.2}
.hero .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.hero .m{font-size:12.5px;font-weight:700;color:oklch(1 0 0 / .75)}

/* liquid glass button */
.gb{display:inline-grid;place-items:center;width:112px;height:40px;border-radius:20px;font-weight:800;font-size:14px;color:#fff;border:0;
  background:linear-gradient(135deg,oklch(1 0 0 / .26),oklch(1 0 0 / .08));box-shadow:inset 0 0 0 1px oklch(1 0 0 / .45),inset 0 1px 0 oklch(1 0 0 / .6),0 8px 18px -10px oklch(0 0 0 / .5);
  -webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5)}
.rfx .gb{-webkit-backdrop-filter:none;backdrop-filter:url(#rf-btn)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;font-weight:700;font-size:14px;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

.promo{display:flex;align-items:center;gap:10px;margin:14px 0;padding:12px 14px;border-radius:16px;background:var(--panel);font-size:13.5px;color:var(--dim)}
.promo b{flex:none;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:99px;color:#fff;background:var(--color-4)}
.promo a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;border-radius:20px;background:var(--panel);min-height:112px}
.cat .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);font-size:19px}
.cat b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.cat small{margin-top:-6px;font-size:12.5px;color:var(--mute);font-weight:600}

.list{display:flex;flex-direction:column}
.mat{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mat:last-child{border-bottom:0}
.th{width:62px;height:62px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2))}
.th .i{width:26px;height:26px}
.mt{flex:1;min-width:0}
.mt .lab{display:block;margin-bottom:2px}
.mt h3{font-size:15.5px;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.mt p{font-size:13px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mute);background:var(--panel);font-size:17px}
.fav.on{color:oklch(from var(--rose) .6 .2 h)}
.fav.on .i{fill:currentColor}
.empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:14px}
.empty .big{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--panel);color:var(--color-4);font-size:24px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.me{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.me .ava{width:64px;height:64px;font-size:24px}
.me b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.me span.s{font-size:13.5px;color:var(--dim)}
.grp{border-radius:22px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.row2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 .ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--c);font-size:18px}
.row2 b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.row2 small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.row2 .go{margin-left:auto;color:var(--mute);font-size:18px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--color-4);flex:none}
.chk small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;font-weight:600}
.note{font-size:12.5px;color:var(--mute);margin:10px 4px}

/* floating liquid-glass tab bar */
.nav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;width:var(--nw,340px);height:64px;border-radius:32px;padding:6px;
  background:linear-gradient(145deg,oklch(1 0 0 / .5),oklch(1 0 0 / .18));
  box-shadow:inset 0 0 0 1px oklch(1 0 0 / .8),inset 0 1.5px 0 oklch(1 0 0),0 18px 40px -16px oklch(from var(--color-6) l c h / .5);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7)}
.rfx .nav{-webkit-backdrop-filter:none;backdrop-filter:url(#rf-nav)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;font-size:11px;font-weight:800;color:var(--dim);transition:background .2s,color .2s}
.tab .i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);background:oklch(1 0 0 / .55);box-shadow:inset 0 0 0 1px oklch(1 0 0 / .9)}

/* sheets */
dialog{border:0;padding:0;background:none;max-width:none;max-height:none;width:100%;height:100%;color:inherit}
dialog::backdrop{background:oklch(from var(--color-7) l c h / .42)}
.sw{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--bg);animation:up .24s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.shc{position:relative;height:150px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2))}
.shc .i{width:54px;height:54px;stroke-width:1.6}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#fff;background:oklch(1 0 0 / .25);box-shadow:inset 0 0 0 1px oklch(1 0 0 / .5)}
.shb{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.shb h2{font-size:23px;line-height:1.12;letter-spacing:-.035em;font-weight:800}
.shb p{color:var(--dim);font-size:14.5px}
.inside{display:grid;gap:8px;list-style:none;padding:0}
.inside li{position:relative;padding-left:27px;font-size:14px;font-weight:600}
.inside li::before{content:"";position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:50%;background:var(--color-4)}
.inside li::after{content:"";position:absolute;left:5px;top:7px;width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.buy{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:4px}
.buy .p{font-size:22px;font-weight:800;letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;border-radius:99px;font-weight:800;font-size:15px;white-space:nowrap;color:#fff;background:var(--ink)}
.btn.p{background:linear-gradient(135deg,var(--color-3),var(--color-4) 55%,var(--deep))}
.btn.w{width:100%}
.btn.g{background:var(--panel);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;font-weight:800;color:var(--dim)}
.f input[type=text]{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;outline:0;font-size:15px}
.f input[type=text]:focus{border-color:var(--color-4);box-shadow:0 0 0 3px oklch(from var(--color-4) l c h / .18)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tg{height:34px;padding:0 14px;border-radius:99px;background:var(--panel);font-weight:700;font-size:13.5px;color:var(--dim)}
.tg[aria-pressed="true"]{background:var(--color-4);color:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;color:#fff;background:oklch(from var(--color-7) l c h / .92);animation:up .2s ease-out;white-space:nowrap}

/* story viewer */
#story{position:fixed;inset:0;z-index:50;background:var(--color-7);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.svc{position:relative;width:100%;max-width:440px;height:100%;max-height:860px;overflow:hidden;color:#fff;display:flex;flex-direction:column;
  background:radial-gradient(90% 60% at 100% 0%,var(--a),transparent 70%),radial-gradient(80% 60% at 0% 100%,var(--b),transparent 70%),linear-gradient(170deg,var(--color-6),var(--color-7))}
.bars{position:absolute;left:14px;right:14px;top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;border-radius:3px;background:oklch(1 0 0 / .28);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.bars i.cur b{animation:fill 5s linear forwards}
.paused .bars i.cur b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.svh{position:absolute;left:14px;right:14px;top:calc(max(12px,env(safe-area-inset-top,0px)) + 14px);display:flex;align-items:center;gap:10px;z-index:4}
.svh .ava{width:36px;height:36px;font-size:13px;background:oklch(1 0 0 / .22)}
.svh b{font-size:14.5px}
.svh .xx{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:oklch(1 0 0 / .18);color:#fff}
.svb{margin:auto 0;padding:80px 28px 40px}
.svb .big{display:block;width:84px;height:84px;color:oklch(1 0 0 / .85);margin-bottom:22px}
.svb .big .i{width:100%;height:100%;stroke-width:1.3}
.svb h2{font-size:30px;line-height:1.1;letter-spacing:-.04em;font-weight:800}
.svb p{margin-top:14px;font-size:17px;line-height:1.45;color:oklch(1 0 0 / .85);max-width:30ch}
.svcta{position:absolute;left:24px;right:24px;bottom:max(28px,env(safe-area-inset-bottom,0px));z-index:4}
.svcta .gb{width:100%;height:52px;border-radius:26px;font-size:15px}
.rfx .svcta .gb{backdrop-filter:url(#rf-wide)}
.tapl,.tapr{position:absolute;top:70px;bottom:100px;z-index:2}
.tapl{left:0;width:32%}.tapr{right:0;width:68%}

footer{margin:28px 4px 8px;color:var(--mute);font-size:12px;line-height:1.7}
footer a{text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

</div>

<nav class="nav" id="nav" aria-label="Разделы приложения">
  <button class="tab" data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <filter id="rf-btn" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feImage id="rfi-btn" x="0" y="0" width="112" height="40" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1" result="b"/><feColorMatrix in="b" type="saturate" values="1.6"/></filter>

</defs></svg>

<script>

function svg(n, cls){ return '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'')+'</svg>'; }
function cat(id){ return CATS.filter(function(c){ return c.id === id; })[0]; }
function mat(id){ return MATS.filter(function(m){ return m.id === id; })[0]; }
function matsIn(cid){ return MATS.filter(function(m){ return m.cat === cid; }); }
function plural(n, a, b, c){ var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 10 || h > 20) ? b : c)); }

/* storage: everything lives on the device (no server yet) */
function ld(k, d){ try { var v = localStorage.getItem('shaton.' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('shaton.' + k, JSON.stringify(v)); } catch(e){} }

function tgUser(){ return tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null; }
function myName(){ var u = tgUser(); return (P && P.name) || (u && u.first_name) || ''; }
function toast(t){ var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 2200); }

   +'<button class="row2" data-go="fav"><span class="ci" style="--c:var(--rose)">'+svg('heart')+'</span><span><b>Избранное</b><small>'+plural(FAV.length,'материал','материала','материалов')+'</small></span><span class="go">›</span></button>'
   +'<button class="row2" data-go="recent"><span class="ci" style="--c:var(--color-4)">'+svg('clock')+'</span><span><b>Недавно смотрели</b><small>материалы, которые вы открывали</small></span><span class="go">›</span></button>'
   +'<button class="row2" data-go="buys"><span class="ci" style="--c:var(--mint)">'+svg('bag')+'</span><span><b>Мои покупки</b><small>платные материалы и доступы</small></span><span class="go">›</span></button></div>'
   +'<div class="grp">'
   +'<a class="row2" href="'+ASK_URL+'" target="_blank" rel="noopener"><span class="ci" style="--c:var(--cyan)">'+svg('chat')+'</span><span><b>Поддержка</b><small>отвечаю сам в Telegram</small></span><span class="go">›</span></a>'
   +'<button class="row2" data-go="docs"><span class="ci" style="--c:var(--violet)">'+svg('doc')+'</span><span><b>Документы</b><small>политика, согласие, контакты</small></span><span class="go">›</span></button></div>'
   +'<div class="grp"><label class="chk"><input type="checkbox" id="ntf"'+(P && P.notify ? ' checked' : '')+'><span>Сообщения о новых материалах<small>Можно включить и выключить в любой момент.</small></span></label></div>'
   +(has ? '<div class="grp"><button class="row2" data-reg><span class="ci" style="--c:var(--color-6)">'+svg('user')+'</span><span><b>Изменить профиль</b><small>имя, контакт, интересы</small></span><span class="go">›</span></button>'
     +'<button class="row2" data-logout><span class="ci" style="--c:var(--rose)">'+svg('tag')+'</span><span><b>Удалить мои данные</b><small>с этого устройства</small></span><span class="go">›</span></button></div>' : '')
   +'<p class="note">Профиль, избранное и история хранятся только на вашем устройстве. Оплата и вход с других устройств появятся позже.</p>';
}

/* ============================ router ============================ */
var cur = {name:'home', arg:null};
var SUB = ['cat','recent','buys','docs'];
var TABOF = {home:'home', cats:'cats', cat:'cats', fav:'fav', me:'me', recent:'me', buys:'me', docs:'me'};
function go(name, arg, push){
  cur = {name:name, arg:arg};
  if (name === 'cat') renderCat(arg);
  else ({home:renderHome, cats:renderCats, fav:renderFav, me:renderMe, recent:renderRecent, buys:renderPurchases, docs:renderDocs}[name] || renderHome)();
  $('#back').hidden = SUB.indexOf(name) < 0;
  $$('.tab').forEach(function(t){ if (t.getAttribute('data-go') === TABOF[name]) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  if (push !== false) history.pushState({name:name,arg:arg}, '');
  window.scrollTo(0, 0);
  hi();
}
function hi(){
  var n = myName();
  $('#hi').innerHTML = cur.name === 'home' ? 'Привет, <b>'+esc(n || 'друг')+'</b>' : '<b>Шатон Learn</b>';
  $('#topAva').innerHTML = avaHtml();
}
window.addEventListener('popstate', function(e){ var s = e.state; if (s && s.name) go(s.name, s.arg, false); else go('home', null, false); });
$('#back').addEventListener('click', function(){ history.back(); });
$('#topAva').addEventListener('click', function(){ go('me'); });
function refresh(){ var y = window.scrollY; go(cur.name, cur.arg, false); window.scrollTo(0, y); }

/* ============================ material sheet ============================ */
var dlg = $('#dlg');
function openMat(id){
  var m = mat(id); if (!m) return;
  RECENT = [id].concat(RECENT.filter(function(x){ return x !== id; })).slice(0, 12); save('recent', RECENT);
  var cta;
  if (m.free) cta = '<div class="buy"><span class="p" style="color:var(--color-4)">Бесплатно</span><a class="btn p" href="'+FREE_URL+'" target="_blank" rel="noopener">Забрать в Telegram</a></div><p class="note" style="margin:0">Файлы лежат одним постом в канале. Откройте пост и сохраните нужный PDF.</p>';
  else if (m.buy) cta = '<div class="buy"><span class="p">'+esc(m.price)+'</span><a class="btn p" href="'+esc(m.buy)+'" target="_blank" rel="noopener">Купить</a></div>';
  else cta = '<div class="buy"><span class="p">'+esc(m.price)+'</span><a class="btn p" href="'+ASK_URL+'?text='+encodeURIComponent('Здравствуйте! Сообщите, пожалуйста, когда выйдет материал «'+m.title+'».')+'" target="_blank" rel="noopener">Сообщить о выходе</a></div><p class="note" style="margin:0">Материал готовится, цена ориентировочная, состав может уточниться.</p>';
  var c = cat(m.cat);
  $('#sheet').innerHTML = '<div class="shc" style="--c1:'+m.c1+';--c2:'+m.c2+'">'+svg(m.ic)+'<button class="x" id="mx" aria-label="Закрыть">✕</button></div>'
    +'<div class="shb"><span class="lab">'+esc(c ? c.name : '')+' · '+esc(m.meta)+'</span><h2>'+esc(m.title)+'</h2><p>'+esc(m.desc)+'</p>'
    +'<span class="lab">'+(m.free ? 'Что внутри' : 'Что будет внутри')+'</span><ul class="inside">'+m.inside.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul>'+cta+'</div>';
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  $('#mx').addEventListener('click', function(){ dlg.close(); });
}
$('#dlgW').addEventListener('click', function(e){ if (e.target === this) dlg.close(); });
dlg.addEventListener('close', function(){ if (cur.name === 'home' || cur.name === 'me') refresh(); });

/* ============================ registration ============================ */
var regD = $('#reg');
function openReg(){
  var u = tgUser(), p = P || {name:(u && u.first_name) || '', contact:(u && u.username) ? '@'+u.username : '', interests:[], notify:false};
  var sel = (p.interests || []).slice();
  $('#regS').innerHTML = '<div class="shb" style="padding-top:22px"><span class="lab">Личный кабинет</span><h2>'+(P ? 'Ваш профиль' : 'Создайте профиль')+'</h2><p>Нужен, чтобы хранить избранное и покупки и подбирать материалы. Данные остаются на этом устройстве.</p>'
    +'<div class="f"><label for="rn">Как к вам обращаться</label><input id="rn" type="text" value="'+esc(p.name)+'" autocomplete="given-name" placeholder="Имя"></div>'
    +'<div class="f"><label for="rc">Telegram или e-mail (по желанию)</label><input id="rc" type="text" value="'+esc(p.contact)+'" placeholder="@username или почта"></div>'
    +'<div class="f"><label>Что интересно</label><div class="tags" id="rt">'+CATS.map(function(c){ return '<button class="tg" data-t="'+c.id+'" aria-pressed="'+(sel.indexOf(c.id) >= 0)+'">'+esc(c.name)+'</button>'; }).join('')+'</div></div>'
    +'<label class="chk" style="padding:4px 0"><input type="checkbox" id="rk"'+(P ? ' checked' : '')+'><span>Согласен на обработку персональных данных<small>См. <a href="consent.html" style="text-decoration:underline">согласие</a> и <a href="privacy.html" style="text-decoration:underline">политику</a>.</small></span></label>'
    +'<button class="btn p w" id="rs">'+(P ? 'Сохранить' : 'Создать профиль')+'</button><button class="btn g w" id="rl">Позже</button></div>';
  $('#rt').addEventListener('click', function(e){ var b = e.target.closest('.tg'); if (!b) return; var id = b.getAttribute('data-t'), i = sel.indexOf(id); if (i >= 0) sel.splice(i,1); else sel.push(id); b.setAttribute('aria-pressed', i < 0); });
  $('#rl').addEventListener('click', function(){ regD.close(); });
  $('#rs').addEventListener('click', function(){
    var nm = $('#rn').value.trim();
    if (!nm) { $('#rn').focus(); return toast('Укажите имя'); }
    if (!$('#rk').checked) return toast('Нужно согласие на обработку данных');
    P = {name:nm, contact:$('#rc').value.trim(), interests:sel, notify:(P && P.notify) || false, createdAt:(P && P.createdAt) || Date.now()};
    save('profile', P); regD.close(); toast('Профиль сохранён на этом устройстве'); refresh();
  });
  if (regD.showModal) regD.showModal(); else regD.setAttribute('open','');
}
$('#regW').addEventListener('click', function(e){ if (e.target === this) regD.close(); });

/* ============================ stories ============================ */
var storyEl = $('#story'), svc = $('#svc'), S = {i:0, j:0};
function openStory(i){ S.i = i; S.j = 0; storyEl.hidden = false; document.body.style.overflow = 'hidden'; showSlide(); }
function closeStory(){ storyEl.hidden = true; document.body.style.overflow = ''; svc.innerHTML = ''; if (cur.name === 'home') refresh(); }
function showSlide(){
  var s = STORIES[S.i], sl = s.slides[S.j];
  SEEN[s.id] = 1; save('seen', SEEN);
  svc.style.setProperty('--a', s.a); svc.style.setProperty('--b', s.b); svc.className = 'svc';
  var bars = s.slides.map(function(_, k){ return '<i class="'+(k < S.j ? 'done' : k === S.j ? 'cur' : '')+'"><b></b></i>'; }).join('');
  var last = S.j === s.slides.length - 1;
  var cta = last && (s.open || s.goCat) ? '<div class="svcta"><button class="gb" id="sc">'+(s.open ? 'Открыть материал' : 'Открыть раздел')+'</button></div>' : '';
  svc.innerHTML = '<div class="bars">'+bars+'</div><div class="svh"><span class="ava">'+esc(s.name.charAt(0))+'</span><b>'+esc(s.name)+'</b><button class="xx" id="sx" aria-label="Закрыть">✕</button></div>'
    +'<div class="svb"><span class="big">'+svg(s.ic)+'</span><h2>'+esc(sl.t)+'</h2><p>'+esc(sl.p)+'</p></div>'+cta
    +'<div class="tapl" id="tl"></div><div class="tapr" id="tr"></div>';
  var cb = $('.bars .cur b', svc); if (cb) cb.addEventListener('animationend', next);
  $('#sx').addEventListener('click', function(e){ e.stopPropagation(); closeStory(); });
  $('#tl').addEventListener('click', prev); $('#tr').addEventListener('click', next);
  var sc = $('#sc'); if (sc) sc.addEventListener('click', function(e){ e.stopPropagation(); var o = s.open, c = s.goCat; closeStory(); if (o) openMat(o); else go('cat', c); });
}
function next(){ var s = STORIES[S.i]; if (S.j < s.slides.length - 1) { S.j++; showSlide(); } else if (S.i < STORIES.length - 1) { S.i++; S.j = 0; showSlide(); } else closeStory(); }
function prev(){ if (S.j > 0) { S.j--; showSlide(); } else if (S.i > 0) { S.i--; S.j = 0; showSlide(); } }
['pointerdown','pointerup','pointercancel','pointerleave'].forEach(function(ev){ svc.addEventListener(ev, function(){ svc.classList.toggle('paused', ev === 'pointerdown'); }); });
document.addEventListener('keydown', function(e){ if (storyEl.hidden) return; if (e.key === 'Escape') closeStory(); else if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); });

/* ============================ events ============================ */
document.addEventListener('input', function(e){
  if (e.target.id !== 'q') return;
  var t = e.target.value.trim().toLowerCase(), f = $('#found'), m = $('#homeMain');
  if (!t) { f.hidden = true; m.hidden = false; return; }
  var rm = MATS.filter(function(x){ return (x.title + ' ' + x.desc + ' ' + (cat(x.cat) || {}).name).toLowerCase().indexOf(t) >= 0; });
  var rc = CATS.filter(function(c){ return c.name.toLowerCase().indexOf(t) >= 0; });
  f.innerHTML = (rc.length ? '<div class="cats" style="margin-bottom:10px">'+rc.map(catTile).join('')+'</div>' : '') + listHtml(rm, 'Ничего не нашлось', 'Попробуйте другое слово.', 'search');
  f.hidden = false; m.hidden = true;
});
document.addEventListener('click', function(e){
  var t = e.target, x;
  if ((x = t.closest('[data-fav]'))) { e.stopPropagation(); var id = x.getAttribute('data-fav'), i = FAV.indexOf(id); if (i >= 0) FAV.splice(i,1); else FAV.push(id); save('fav', FAV); x.classList.toggle('on', i < 0); if (cur.name === 'fav') refresh(); return; }
  if ((x = t.closest('[data-m]'))) return openMat(x.getAttribute('data-m'));
  if ((x = t.closest('[data-s]'))) return openStory(+x.getAttribute('data-s'));
  if ((x = t.closest('[data-c]'))) return go('cat', x.getAttribute('data-c'));
  if ((x = t.closest('[data-go]'))) return go(x.getAttribute('data-go'));
  if ((x = t.closest('[data-hf]'))) { homeFilter = x.getAttribute('data-hf'); return refresh(); }
  if (t.closest('[data-reg]')) return openReg();
  if (t.closest('[data-open-channel]')) return window.open(CHANNEL, '_blank');
  if (t.closest('[data-notify]')) { if (!P) { toast('Сначала создайте профиль'); return openReg(); } P.notify = true; save('profile', P); return toast('Готово: напишу, когда появятся материалы'); }
  if (t.closest('[data-logout]')) { if (confirm('Удалить профиль, избранное и историю с этого устройства?')) { ['profile','fav','recent','seen'].forEach(function(k){ try { localStorage.removeItem('shaton.' + k); } catch(e){} }); P = null; FAV = []; RECENT = []; SEEN = {}; go('home'); toast('Данные удалены'); } return; }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'ntf') { if (!P) { e.target.checked = false; toast('Сначала создайте профиль'); return openReg(); } P.notify = e.target.checked; save('profile', P); toast(P.notify ? 'Уведомления включены' : 'Уведомления выключены'); }
});
document.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-m][role=button]')) { e.preventDefault(); openMat(e.target.getAttribute('data-m')); } });
$('#nav').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (b) go(b.getAttribute('data-go')); });

/* ============================ liquid glass (refraction) ============================
   Chromium only (Chrome, Edge, Telegram Desktop and Android): backdrop-filter:url(#svg) with a displacement map built here,
   following a convex-squircle bezel (kube.io/blog/liquid-glass-css-svg). Everywhere else the same elements use a plain frosted blur. */
var UA = navigator.userAgent, chromium = /Chrome\/|Chromium\/|Edg\//.test(UA) && !/Firefox|CriOS|FxiOS|OPR\//.test(UA);
function dispMap(w, h, r, bez){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d'), im = x.createImageData(w, h), d = im.data;
  function sd(px, py){ var qx = Math.abs(px - w/2) - (w/2 - r), qy = Math.abs(py - h/2) - (h/2 - r);
    return -(Math.hypot(Math.max(qx,0), Math.max(qy,0)) + Math.min(Math.max(qx,qy),0) - r); }
  for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) {
    var o = (yy * w + xx) * 4, dist = sd(xx + .5, yy + .5), R = 128, G = 128;
    if (dist > 0 && dist < bez) {
      var t = dist / bez, m = Math.pow(1 - t, 2.4);                     /* refraction fades from the rim to the flat middle */
      var gx = (sd(xx + 1.5, yy + .5) - sd(xx - .5, yy + .5)) / 2, gy = (sd(xx + .5, yy + 1.5) - sd(xx + .5, yy - .5)) / 2;
      R = 128 + 127 * gx * m; G = 128 + 127 * gy * m;
    }
    d[o] = R; d[o+1] = G; d[o+2] = 128; d[o+3] = 255;
  }
  x.putImageData(im, 0, 0); return c.toDataURL();
}
function setFilter(id, w, h, r, bez, scale){
  var fi = document.getElementById('rfi-' + id); if (!fi) return;
  fi.setAttribute('width', w); fi.setAttribute('height', h); fi.setAttribute('href', dispMap(w, h, r, bez));
  var fe = fi.parentNode.querySelector('feDisplacementMap'); if (fe) fe.setAttribute('scale', scale);
}
function sizeNav(){
  var w = Math.round(Math.min(380, window.innerWidth - 28)); $('#nav').style.setProperty('--nw', w + 'px');
  if (chromium) { setFilter('nav', w, 64, 32, 22, 30); setFilter('wide', Math.min(392, window.innerWidth - 48), 52, 26, 18, 20); }
}
var _rt; window.addEventListener('resize', function(){ clearTimeout(_rt); _rt = setTimeout(sizeNav, 150); });
if (chromium) { document.documentElement.classList.add('rfx'); setFilter('btn', 112, 40, 20, 14, 18); }
sizeNav();

/* ============================ boot ============================ */
if (/tgWebAppData|tgWebAppVersion/.test(location.hash) || /Telegram/i.test(UA)) {
  var scr = document.createElement('script'); scr.src = 'https://telegram.org/js/telegram-web-app.js'; scr.async = true;
  scr.onload = function(){
    tg = window.Telegram && window.Telegram.WebApp; if (!tg || !tg.initData) { tg = null; return; }
    try { tg.ready(); tg.expand(); if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#f6f7fb'); tg.setBackgroundColor('#f6f7fb'); } } catch(e){}
    hi(); if (cur.name === 'home' || cur.name === 'me') refresh();
  };
  document.head.appendChild(scr);
}
history.replaceState({name:'home'}, '');
go('home', null, false);
if (!P && !sessionStorage.getItem('shaton.askReg')) { setTimeout(function(){ if (storyEl.hidden && !dlg.open) { try { sessionStorage.setItem('shaton.askReg', '1'); } catch(e){} openReg(); } }, 2500); }
</script>
