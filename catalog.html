<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шатон Learn — материалы по маркетингу</title>
<meta name="description" content="Лента практических материалов по Авито, Яндекс Директу, сайтам, SEO и SMM: посты с таблицами и схемами, сторис, разделы и личный кабинет. Работает и как Telegram-мини-приложение.">
<link rel="canonical" href="https://davidshaton2006-droid.github.io/shaton-marketing/catalog.html">
<meta name="theme-color" content="#f6f7fb">
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Manrope';font-display:swap;font-weight:300 800;src:url(fonts/manrope-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-display:swap;font-weight:300 800;src:url(fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212}

/* Colour system (Ein UI rules): one anchor, 7 OKLCH stops with chroma tapering, everything else derived. */
:root{
  --color-1:oklch(0.95 0.081 266);--color-2:oklch(0.85 0.118 266);--color-3:oklch(0.73 0.162 266);--color-4:oklch(0.60 0.210 266);
  --color-5:oklch(0.48 0.166 266);--color-6:oklch(0.35 0.118 266);--color-7:oklch(0.20 0.063 266);
  --violet:oklch(from var(--color-3) l c calc(h + 34));--cyan:oklch(from var(--color-3) l c calc(h - 54));--deep:oklch(from var(--color-5) l c calc(h + 16));
  --rose:oklch(from var(--color-3) l c calc(h + 80));--mint:oklch(from var(--color-3) l c calc(h - 100));
  --ink:oklch(from var(--color-7) .17 calc(c*.5) h);
  --dim:oklch(from var(--color-5) .5 calc(c*.18) h);
  --mute:oklch(from var(--color-3) .68 calc(c*.18) h);
  --bg:oklch(from var(--color-1) .978 calc(c*.14) h);
  --panel:oklch(from var(--color-1) .958 calc(c*.16) h);
  --line:oklch(from var(--color-1) .9 calc(c*.3) h);
  --glass:linear-gradient(150deg,oklch(1 0 0 / .72),oklch(1 0 0 / .34));
  --edge:inset 0 0 0 1px oklch(1 0 0 / .85),inset 0 1px 0 oklch(1 0 0);
  --soft:0 14px 32px -18px oklch(from var(--color-5) l c h / .45);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:clip;
  background-image:radial-gradient(70% 36% at 100% 0%,oklch(from var(--color-2) l c h / .45),transparent 70%),radial-gradient(60% 30% at 0% 38%,oklch(from var(--violet) .93 c h / .4),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 18px calc(120px + env(safe-area-inset-bottom,0px));overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:60px;padding:max(8px,env(safe-area-inset-top,0px)) 0 8px;background:linear-gradient(var(--bg) 62%,transparent)}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-size:18px;flex:none}
.hi{flex:1;font-size:15px;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi b{color:var(--ink);font-weight:800}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--color-3),var(--color-5))}
.ava img{width:100%;height:100%;object-fit:cover}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:40;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--color-3),var(--color-4),var(--violet))}

/* ---------- glass icon tile (used everywhere instead of flat icons) ---------- */
.gi{position:relative;flex:none;width:var(--s,44px);height:var(--s,44px);border-radius:32%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(120% 90% at 22% 8%,oklch(1 0 0 / .6),transparent 55%),linear-gradient(150deg,oklch(from var(--t,var(--color-4)) l c h),oklch(from var(--t,var(--color-4)) calc(l*.72) c h));
  box-shadow:inset 0 0 0 1px oklch(1 0 0 / .5),inset 0 1px 0 oklch(1 0 0 / .85),0 10px 22px -10px oklch(from var(--t,var(--color-4)) l c h / .9)}
.gi::after{content:"";position:absolute;left:14%;right:14%;top:7%;height:30%;border-radius:99px;background:linear-gradient(oklch(1 0 0 / .45),oklch(1 0 0 / 0));pointer-events:none}
.gi .i{position:relative;z-index:1;width:52%;height:52%;stroke-width:1.9;filter:drop-shadow(0 1px 1px oklch(0 0 0 / .25))}

/* ---------- stories ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:6px 18px 10px;margin:0 -18px;scroll-snap-type:x proximity;scroll-padding-inline:18px}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:72px;text-align:center;scroll-snap-align:start}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(var(--color-4),var(--violet),var(--cyan),var(--color-4));display:grid;place-items:center}
.st.seen .ring{background:var(--line)}
.ring span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;border:3px solid var(--bg);background:var(--bg)}
.ring .gi{--s:100%;border-radius:50%}
.st small{display:block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.search{display:flex;align-items:center;gap:10px;height:46px;margin:8px 0 14px;padding:0 16px;border-radius:16px;background:var(--panel);color:var(--mute)}
.search .i{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px;scroll-padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;font-weight:700;font-size:14px;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:21px;font-weight:800;letter-spacing:-.03em}
.sec button{font-size:13px;font-weight:700;color:var(--color-5)}
.lab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* ---------- feed (X / Threads style) ---------- */
.feed{margin-top:6px}
.post{display:flex;gap:12px;padding:16px 0 14px;border-bottom:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 520px}
.post:last-child{border-bottom:0}
.pa{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.pa .gi{--s:42px;border-radius:50%}
.pa i.th{flex:1;width:2px;border-radius:2px;background:linear-gradient(var(--line),transparent)}
.pb{flex:1;min-width:0}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.ph b{font-weight:800}
.ph .v{width:15px;height:15px;color:var(--color-4)}
.ph .pm{color:var(--mute);font-weight:600;font-size:13px}
.bd{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:var(--color-5);background:oklch(from var(--color-3) l c h / .22)}
.bd.paid{color:oklch(from var(--rose) .45 .16 h);background:oklch(from var(--rose) l c h / .2)}
.post h3{margin-top:6px;font-size:18px;line-height:1.22;letter-spacing:-.025em;font-weight:800}
.pe{margin-top:4px;font-size:14.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cov{position:relative;margin-top:12px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;isolation:isolate;
  background:radial-gradient(80% 100% at 12% 18%,var(--a),transparent 62%),radial-gradient(70% 90% at 92% 88%,var(--b),transparent 62%),linear-gradient(140deg,var(--color-6),var(--color-7))}
.cov .o{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,oklch(1 0 0 / .5),oklch(1 0 0 / .07) 55%,transparent 70%);box-shadow:inset 0 0 0 1px oklch(1 0 0 / .3);animation:fl 8s ease-in-out infinite}
.cov .o1{width:34%;aspect-ratio:1;left:-6%;bottom:-18%}
.cov .o2{width:18%;aspect-ratio:1;left:52%;top:10%;animation-delay:-3s}
.cov .o3{width:11%;aspect-ratio:1;right:8%;bottom:14%;animation-delay:-5s}
.cov .gi{position:absolute;right:11%;top:50%;margin-top:calc(var(--s) / -2);--s:36%;width:auto;aspect-ratio:1;height:auto;animation:fl 9s ease-in-out infinite -2s}
.cov .gi{width:26%;height:auto}
.cov .ct{position:absolute;left:6%;bottom:9%;max-width:56%;color:#fff;font-weight:800;font-size:clamp(15px,4.4vw,22px);line-height:1.1;letter-spacing:-.03em;text-shadow:0 2px 14px oklch(0 0 0 / .3)}
.cov .ct small{display:block;margin-bottom:5px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:oklch(1 0 0 / .65)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.act{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--mute);font-size:13px;font-weight:700}
.act .fav,.act .sh{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.act .fav.on{color:oklch(from var(--rose) .6 .2 h)}
.act .fav.on .i{fill:currentColor}
.act .sp{margin-left:auto}
.act span.m{display:inline-flex;align-items:center;gap:5px;padding:0 6px}
.act span.m .i{width:15px;height:15px}
.empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:14px}
.empty .big{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--panel);color:var(--color-4);font-size:24px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- categories / lists / profile ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;gap:12px;text-align:left;padding:14px;border-radius:22px;background:var(--panel);min-height:120px}
.cat b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.cat small{margin-top:-8px;font-size:12.5px;color:var(--mute);font-weight:600}
.me{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.me .ava{width:64px;height:64px;font-size:24px}
.me b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.me span.s{font-size:13.5px;color:var(--dim)}
.grp{border-radius:22px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.row2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 .gi{--s:40px;border-radius:50%}
.row2 b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.row2 small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.row2 .go{margin-left:auto;color:var(--mute);font-size:18px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--color-4);flex:none}
.chk small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;font-weight:600}
.note{font-size:12.5px;color:var(--mute);margin:10px 4px}

/* ---------- floating liquid-glass tab bar ---------- */
.nav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;width:var(--nw,340px);height:64px;border-radius:32px;padding:6px;
  background:linear-gradient(145deg,oklch(1 0 0 / .5),oklch(1 0 0 / .18));
  box-shadow:inset 0 0 0 1px oklch(1 0 0 / .8),inset 0 1.5px 0 oklch(1 0 0),0 18px 40px -16px oklch(from var(--color-6) l c h / .5);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7)}
.rfx .nav{-webkit-backdrop-filter:none;backdrop-filter:url(#rf-nav)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;font-size:11px;font-weight:800;color:var(--dim);transition:background .2s,color .2s}
.tab .i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);background:oklch(1 0 0 / .55);box-shadow:inset 0 0 0 1px oklch(1 0 0 / .9)}
.gb{display:inline-grid;place-items:center;width:112px;height:40px;border-radius:20px;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,oklch(1 0 0 / .26),oklch(1 0 0 / .08));box-shadow:inset 0 0 0 1px oklch(1 0 0 / .45),inset 0 1px 0 oklch(1 0 0 / .6),0 8px 18px -10px oklch(0 0 0 / .5);
  -webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5)}
.rfx .gb{-webkit-backdrop-filter:none;backdrop-filter:url(#rf-btn)}

/* ---------- sheets / buttons / forms ---------- */
dialog{border:0;padding:0;background:none;max-width:none;max-height:none;width:100%;height:100%;color:inherit}
dialog::backdrop{background:oklch(from var(--color-7) l c h / .42)}
.sw{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--bg);animation:up .24s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.shb{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.shb h2{font-size:23px;line-height:1.12;letter-spacing:-.035em;font-weight:800}
.shb p{color:var(--dim);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;border-radius:99px;font-weight:800;font-size:15px;white-space:nowrap;color:#fff;background:var(--ink)}
.btn.p{background:linear-gradient(135deg,var(--color-3),var(--color-4) 55%,var(--deep))}
.btn.w{width:100%}
.btn.g{background:var(--panel);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;font-weight:800;color:var(--dim)}
.f input[type=text]{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;outline:0;font-size:15px}
.f input[type=text]:focus{border-color:var(--color-4);box-shadow:0 0 0 3px oklch(from var(--color-4) l c h / .18)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tg{height:34px;padding:0 14px;border-radius:99px;background:var(--panel);font-weight:700;font-size:13.5px;color:var(--dim)}
.tg[aria-pressed="true"]{background:var(--color-4);color:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;color:#fff;background:oklch(from var(--color-7) l c h / .92);animation:up .2s ease-out;white-space:nowrap}

/* ---------- story viewer ---------- */
#story{position:fixed;inset:0;z-index:50;background:var(--color-7);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.svc{position:relative;width:100%;max-width:440px;height:100%;max-height:860px;overflow:hidden;color:#fff;display:flex;flex-direction:column;
  background:radial-gradient(90% 60% at 100% 0%,var(--a),transparent 70%),radial-gradient(80% 60% at 0% 100%,var(--b),transparent 70%),linear-gradient(170deg,var(--color-6),var(--color-7))}
.bars{position:absolute;left:14px;right:14px;top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;border-radius:3px;background:oklch(1 0 0 / .28);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.bars i.cur b{animation:fill 5s linear forwards}
.paused .bars i.cur b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.svh{position:absolute;left:14px;right:14px;top:calc(max(12px,env(safe-area-inset-top,0px)) + 14px);display:flex;align-items:center;gap:10px;z-index:4}
.svh .ava{width:36px;height:36px;font-size:13px;background:oklch(1 0 0 / .22)}
.svh b{font-size:14.5px}
.svh .xx{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:oklch(1 0 0 / .18);color:#fff}
.svb{margin:auto 0;padding:80px 28px 40px}
.svb .gi{--s:96px;margin-bottom:24px;border-radius:30%}
.svb h2{font-size:30px;line-height:1.1;letter-spacing:-.04em;font-weight:800}
.svb p{margin-top:14px;font-size:17px;line-height:1.45;color:oklch(1 0 0 / .85);max-width:30ch}
.svcta{position:absolute;left:24px;right:24px;bottom:max(28px,env(safe-area-inset-bottom,0px));z-index:4}
.svcta .gb{width:100%;height:52px;border-radius:26px;font-size:15px}
.rfx .svcta .gb{backdrop-filter:url(#rf-wide)}
.tapl,.tapr{position:absolute;top:70px;bottom:100px;z-index:2}
.tapl{left:0;width:32%}.tapr{right:0;width:68%}

/* ======================= POST READER ======================= */
.rd-cov{position:relative;margin:4px 0 0;border-radius:26px;overflow:hidden}
.rd-cov .cov{margin:0;border-radius:26px}
.rd-t{margin:18px 0 8px;font-size:clamp(26px,7.4vw,34px);line-height:1.08;letter-spacing:-.04em;font-weight:800}
.rd-m{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--dim);font-size:13.5px;font-weight:700}
.rd-m .gi{--s:30px;border-radius:50%}
.rd-m .by{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:800}
.rd-d{margin-top:12px;font-size:16.5px;line-height:1.55;color:var(--dim)}
.toc{position:sticky;top:56px;z-index:15;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:18px -18px 6px;padding:8px 18px;scroll-padding-inline:18px;background:linear-gradient(var(--bg) 70%,transparent)}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 6px;border-radius:99px;font-size:13px;font-weight:700;color:var(--dim);background:var(--glass);box-shadow:var(--edge)}
.toc a b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;background:linear-gradient(140deg,var(--color-3),var(--color-5))}
.toc a.on{color:var(--ink);background:oklch(1 0 0 / .95)}
.pbody{font-size:16.5px;line-height:1.68;color:oklch(from var(--ink) .26 c h)}
.pbody p{margin:0 0 14px}
.pbody b{font-weight:800;color:var(--ink)}
.pbody code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;padding:1px 6px;border-radius:7px;background:var(--panel)}
.ch{margin-top:34px;scroll-margin-top:96px}
.chh{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;margin-bottom:14px}
.chn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;letter-spacing:-.02em;background:radial-gradient(120% 90% at 22% 8%,oklch(1 0 0 / .5),transparent 55%),linear-gradient(150deg,var(--color-3),var(--color-5));box-shadow:inset 0 0 0 1px oklch(1 0 0 / .45),0 10px 20px -10px oklch(from var(--color-4) l c h / .9)}
.chh h2{font-size:23px;line-height:1.1;letter-spacing:-.035em;font-weight:800;color:var(--ink)}
.chh .lead{grid-column:1/-1;margin:12px 0 0;font-size:16.5px;line-height:1.55;color:var(--dim);font-weight:500}
.h3{margin:26px 0 10px;font-size:18.5px;line-height:1.2;letter-spacing:-.025em;font-weight:800;color:var(--ink)}

.co.imp{--cc:oklch(0.68 0.19 45)}.co.pr{--cc:oklch(0.66 0.15 175)}.co.err{--cc:oklch(0.6 0.22 20)}.co.ex{--cc:var(--violet)}.co.num{--cc:var(--color-4)}

.tbl td{padding:12px 14px;vertical-align:top;border-top:1px solid oklch(from var(--color-3) l c h / .22)}
.tbl td:first-child{font-weight:800;color:var(--ink)}
.tbl tbody tr:nth-child(even) td{background:oklch(1 0 0 / .35)}

}

function applyData(d){

  (d.cats || []).forEach(function(c){ var i = CATS.map(function(x){ return x.id; }).indexOf(c.id); if (c.deleted) { if (i >= 0) CATS.splice(i, 1); } else if (i >= 0) CATS[i] = Object.assign(CATS[i], c); else CATS.push(c); });

    var i = MATS.map(function(x){ return x.id; }).indexOf(m.id);
    if (m.meta) MET[m.id] = m.meta;
    if (m.deleted) { if (i >= 0) MATS.splice(i, 1); return; }
    if (i >= 0) MATS[i] = Object.assign(MATS[i], m); else MATS.unshift(m);
  });
  MATS = MATS.filter(function(m){ return !m.hidden; });
  (d.stories || []).slice().reverse().forEach(function(st){
    var i = STORIES.map(function(x){ return x.id; }).indexOf(st.id);
    if (st.deleted) { if (i >= 0) STORIES.splice(i, 1); return; }
    if (i >= 0) STORIES[i] = Object.assign(STORIES[i], st); else STORIES.unshift(st);
  });
}

var UA = navigator.userAgent, chromium = /Chrome\/|Chromium\/|Edg\//.test(UA) && !/Firefox|CriOS|FxiOS|OPR\//.test(UA);

    return -(Math.hypot(Math.max(qx,0), Math.max(qy,0)) + Math.min(Math.max(qx,qy),0) - r); }

    var o = (yy * w + xx) * 4, dist = sd(xx + .5, yy + .5), R = 128, G = 128;
